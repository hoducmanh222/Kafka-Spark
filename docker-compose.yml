name: retail-rocket-streaming
x-app: &app
  platform: linux/amd64
  build: .
  image: retail-rocket-streaming:local
  volumes:
    - ./runtime:/app/runtime
    - ./data:/app/data:ro
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPARK_LOCAL_IP: 0.0.0.0
    PYTHONUNBUFFERED: '1'
services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - '127.0.0.1:29092:29092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_PARTITIONS: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  topic-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/bash', '-ec']
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic retail-rocket-events
        --partitions 2 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --describe --topic retail-rocket-events
  data-init:
    <<: *app
    volumes:
      - ./data:/app/data
    command: ['python', 'scripts/ensure_data.py']
  spark:
    <<: *app
    depends_on:
      topic-init:
        condition: service_completed_successfully
    command: ['spark-submit', '--master', 'local[2]', '--driver-memory', '4g', '--conf', 'spark.driver.bindAddress=0.0.0.0', '--conf', 'spark.driver.host=spark', '--packages', 'org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7', 'streaming_etl.py', '--console']
    ports:
      - '127.0.0.1:4040:4040'
    healthcheck:
      test: ['CMD', 'python', 'scripts/healthcheck.py']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    stop_grace_period: 60s
  producer:
    <<: *app
    depends_on:
      spark:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    command: ['python', 'producer.py', '--csv', 'data/events.csv', '--interval', '0', '--replay-clock', '--expected-rows', '2756101', '--completion-file', 'runtime/producer_complete.json']
  demo:
    <<: *app
    profiles: ['tools']
    depends_on:
      spark:
        condition: service_healthy
    command: ['python', 'scripts/live_demo.py']
  acceptance:
    <<: *app
    profiles: ['tools']
    depends_on:
      spark:
        condition: service_healthy
    command: ['python', 'tests/e2e_acceptance.py']
  verify-full:
    <<: *app
    profiles: ['tools']
    command: ['python', 'scripts/verify_full_replay.py']
volumes:
  kafka-data:
